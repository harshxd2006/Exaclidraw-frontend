<!-- ==========================================================================
     Zoom, History & Grid Controls Component Template
     Floating bottom-left pill with Undo, Redo, Zoom, and Grid actions.
     Reference: packages/excalidraw/components/LayerUI.tsx in Excalidraw
     ========================================================================== -->

<div class="zoom-controls" role="toolbar" aria-label="Zoom, History, and Grid Controls">
  <!-- Undo Button -->
  <button type="button" class="zoom-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 14 4 9 9 4"></polyline>
      <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
    </svg>
  </button>

  <!-- Redo Button -->
  <button type="button" class="zoom-btn" id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" aria-label="Redo" disabled>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 14 20 9 15 4"></polyline>
      <path d="M4 20v-7a4 4 0 0 1 4-4h12"></path>
    </svg>
  </button>

  <!-- Separator between History and Zoom -->
  <div class="zoom-separator"></div>

  <!-- Zoom Out Button -->
  <button type="button" class="zoom-btn" id="zoom-out-btn" title="Zoom out (Ctrl+-)" aria-label="Zoom out">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- Zoom Percentage / Reset Button -->
  <button type="button" class="zoom-value-btn" id="zoom-reset-btn" title="Reset zoom to 100% (Ctrl+0)" aria-label="Reset zoom">
    <span id="zoom-value-label">100%</span>
  </button>

  <!-- Zoom In Button -->
  <button type="button" class="zoom-btn" id="zoom-in-btn" title="Zoom in (Ctrl++)" aria-label="Zoom in">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>

  <!-- Separator between Zoom and Grid -->
  <div class="zoom-separator"></div>

  <!-- Grid Mode Toggle Button -->
  <button type="button" class="zoom-btn active" id="btn-grid" title="Toggle grid mode (Ctrl+')" aria-label="Toggle grid">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <line x1="3" y1="9" x2="21" y2="9"></line>
      <line x1="3" y1="15" x2="21" y2="15"></line>
      <line x1="9" y1="3" x2="9" y2="21"></line>
      <line x1="15" y1="3" x2="15" y2="21"></line>
    </svg>
  </button>
</div>
