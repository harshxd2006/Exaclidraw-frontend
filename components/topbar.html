<!-- ==========================================================================
     Topbar Component Template
     Hamburger Main Menu and Quick Export button.
     Reference: packages/excalidraw/components/LayerUI.tsx in Excalidraw
     ========================================================================== -->

<div class="topbar-left">
  <!-- Hamburger Main Menu Button -->
  <button type="button" class="topbar-btn" id="btn-app-menu" title="Main menu" aria-label="Main menu" aria-haspopup="true" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- Main Menu Dropdown -->
  <div class="app-menu-dropdown" id="app-menu-dropdown" style="display: none;" role="menu">
    <!-- Open / Load File -->
    <button type="button" class="app-menu-item" id="menu-item-open" role="menuitem">
      <div class="app-menu-item-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Open...</span>
      </div>
      <span class="app-menu-shortcut">Ctrl+O</span>
    </button>

    <!-- Save to Disk -->
    <button type="button" class="app-menu-item" id="menu-item-save" role="menuitem">
      <div class="app-menu-item-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>Save to disk</span>
      </div>
      <span class="app-menu-shortcut">Ctrl+S</span>
    </button>

    <!-- Export Image Modal -->
    <button type="button" class="app-menu-item" id="menu-item-export" role="menuitem">
      <div class="app-menu-item-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Export image...</span>
      </div>
      <span class="app-menu-shortcut">Ctrl+Shift+E</span>
    </button>

    <div class="app-menu-separator"></div>

    <!-- Reset Canvas -->
    <button type="button" class="app-menu-item item-danger" id="menu-item-reset" role="menuitem">
      <div class="app-menu-item-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Reset canvas</span>
      </div>
    </button>
  </div>

  <!-- Hidden File Input for Loading .excalidraw files -->
  <input type="file" id="file-input-load" accept=".excalidraw,.json" style="display: none;">
</div>

<div class="topbar-right">
  <!-- Quick Export Button -->
  <button type="button" class="topbar-action-btn" id="btn-quick-export" title="Export image (Ctrl+Shift+E)" aria-label="Export image">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span>Export</span>
  </button>
</div>
